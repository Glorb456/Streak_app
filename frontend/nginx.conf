server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Streak Notes' API. Longer prefix than /api/ below, and nginx matches the
    # longest prefix, so this wins for notes without either app knowing about
    # the other. Under the same /api root deliberately: oauth2-proxy's
    # --api-route=^/api then covers it too, and an expired session answers
    # the notes poll with a 401 rather than a Google login page.
    location /api/notes/ {
        proxy_pass http://notes-backend:8000;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # Streak Notes itself. Same origin as the task app, so the one oauth2-proxy
    # cookie authorises both and switching apps is a plain navigation.
    # The trailing slash on proxy_pass strips /notes/, so the notes container
    # serves ordinary root-relative paths.
    location = /notes { return 302 /notes/; }
    location /notes/ {
        proxy_pass http://notes-frontend:80/;
        proxy_set_header Host $host;
    }

    # nginx's bundled mime.types has no .webmanifest entry, so it would fall
    # back to application/octet-stream. default_type wins precisely because the
    # extension is unknown.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    location / {
        try_files $uri /index.html;
    }
}
