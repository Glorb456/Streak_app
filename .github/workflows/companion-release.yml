# Builds the Streak Companion installers — Windows (.exe) on GitHub's
# windows-latest runner and Linux (.deb + AppImage) on ubuntu-latest — so no
# Windows or Linux machine is needed to cut a release.
#
# Two ways to get the installers:
#   - Actions tab -> "Build Streak Companion" -> Run workflow.
#     The installers land as downloadable artifacts on that run
#     (streak-companion-windows, streak-companion-linux). Use this for a
#     one-off build or to test a change.
#   - Push a tag starting with "companion-v" (e.g. companion-v1.1.0). Same
#     build, but everything is also published to one GitHub Release, which
#     is what the companion README tells people to download.
name: Build Streak Companion

on:
  workflow_dispatch:
  push:
    tags:
      - 'companion-v*'

permissions:
  contents: write   # required to create the Release on a tag build

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # No package-lock.json is committed for the companion (its only deps
      # are the build toolchain), so this is `install`, not `ci`.
      - name: Install build dependencies
        working-directory: companion
        run: npm install --no-audit --no-fund

      # --publish never: uploading is this workflow's job, below, so that a
      # manual run produces an artifact without ever touching Releases.
      - name: Build installer
        working-directory: companion
        run: npx electron-builder --win --publish never

      - name: Upload installer as a run artifact
        uses: actions/upload-artifact@v4
        with:
          name: streak-companion-windows
          path: companion/dist/*.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install build dependencies
        working-directory: companion
        run: npm install --no-audit --no-fund

      # deb for Ubuntu / Debian / Linux Mint (the targets this is built for),
      # AppImage as the run-anywhere fallback. Both come from the same
      # electron-builder config in companion/package.json.
      - name: Build .deb and AppImage
        working-directory: companion
        run: npx electron-builder --linux --publish never

      - name: Upload packages as a run artifact
        uses: actions/upload-artifact@v4
        with:
          name: streak-companion-linux
          path: |
            companion/dist/*.deb
            companion/dist/*.AppImage
          if-no-files-found: error

  # Tag builds only: gather both platforms' artifacts into a single Release.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/*.exe
            packages/*.deb
            packages/*.AppImage
          generate_release_notes: true
